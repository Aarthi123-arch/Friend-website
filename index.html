<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise 💖</title>

    <!-- Cute Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #ffd6e7,
                #f6d9ff,
                #e7dcff
            );

            font-family: 'Quicksand', sans-serif;
            overflow: hidden;
        }


        /* ---------- MAIN CARD ---------- */

        .card {
            width: 460px;
            max-width: 90%;

            background: rgba(255, 255, 255, 0.96);

            padding: 55px 35px;

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(131, 77, 142, 0.20);

            position: relative;
            z-index: 5;

            animation: cardAppear 1s ease;
        }


        /* ---------- HEADING ---------- */

        h1 {
            font-family: 'Pacifico', cursive;

            font-size: 42px;

            color: #ff4f87;

            margin-bottom: 20px;

            animation: cuteBounce 2s ease-in-out infinite;
        }


        /* ---------- SMALL MESSAGE ---------- */

        .message {
            font-size: 18px;

            color: #777;

            margin-bottom: 32px;
        }


        /* ---------- QUESTION ---------- */

        h2 {
            font-size: 24px;

            color: #333;

            font-weight: 700;

            margin-bottom: 25px;
        }


        /* ---------- BUTTON AREA ---------- */

        .buttons {
            display: flex;

            justify-content: center;
            align-items: center;

            gap: 15px;

            min-height: 80px;

            position: relative;
        }


        /* ---------- BOTH BUTTONS ---------- */

        button {
            border: none;

            min-width: 125px;

            padding: 15px 28px;

            border-radius: 30px;

            font-family: Arial, sans-serif;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            position: relative;

            z-index: 20;

            transition:
                transform 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
        }


        /* ---------- YES BUTTON ---------- */

        #yesBtn {
            background: #ff5a91;

            color: white;

            box-shadow:
                0 6px 18px rgba(255, 90, 145, 0.35);
        }

        #yesBtn:hover {
            background: #ff3477;

            transform: scale(1.10);

            box-shadow:
                0 8px 22px rgba(255, 52, 119, 0.4);
        }


        /* ---------- NO BUTTON ---------- */

        #noBtn {
            background: #eeeeee;

            color: #444;

            transition: transform 0.2s ease;
        }


        /* ---------- HEARTS ---------- */

        .heart {
            position: fixed;

            bottom: -50px;

            color: #ff8eb2;

            font-size: 25px;

            opacity: 0;

            z-index: 1;

            pointer-events: none;

            animation: floatingHeart 7s linear infinite;
        }


        .heart1 {
            left: 10%;
            animation-delay: 0s;
        }

        .heart2 {
            left: 25%;
            animation-delay: 2s;
        }

        .heart3 {
            left: 50%;
            animation-delay: 4s;
        }

        .heart4 {
            left: 72%;
            animation-delay: 1s;
        }

        .heart5 {
            left: 88%;
            animation-delay: 3s;
        }


        /* ---------- ANIMATIONS ---------- */

        @keyframes cardAppear {

            0% {
                opacity: 0;

                transform:
                    translateY(40px)
                    scale(0.9);
            }

            100% {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }
        }


        @keyframes cuteBounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }


        @keyframes floatingHeart {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.7;
            }

            80% {
                opacity: 0.7;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* ---------- MOBILE ---------- */

        @media (max-width: 500px) {

            .card {
                padding: 45px 20px;
            }

            h1 {
                font-size: 35px;
            }

            h2 {
                font-size: 21px;
            }

            .message {
                font-size: 16px;
            }

            button {
                min-width: 105px;

                padding: 14px 20px;
            }
        }

    </style>

</head>


<body>


    <!-- Floating hearts -->

    <div class="heart heart1">♡</div>
    <div class="heart heart2">♥</div>
    <div class="heart heart3">♡</div>
    <div class="heart heart4">♥</div>
    <div class="heart heart5">♡</div>



    <!-- Main Card -->

    <div class="card">

        <h1>
            Heyyy! 💖
        </h1>


        <p class="message">
            I made a little surprise for you ✨
        </p>


        <h2>
            Do you want to see it? 👀
        </h2>


        <div class="buttons">

            <button
                id="yesBtn"
                type="button"
                onclick="openSurprise()"
            >
                YES 💕
            </button>


            <button
                id="noBtn"
                type="button"
                onmouseover="moveButton()"
                onclick="moveButton()"
            >
                NO 😂
            </button>

        </div>

    </div>



    <script>

        /* YES BUTTON */

        function openSurprise() {

         }



        /* NO BUTTON RUNS AWAY */

        function moveButton() {

            const noButton =
                document.getElementById("noBtn");


            const x =
                Math.random() * 220 - 110;


            const y =
                Math.random() * 130 - 65;


            noButton.style.transform =
                `translate(${x}px, ${y}px)`;

        }

    </script>


</body>

</html>
