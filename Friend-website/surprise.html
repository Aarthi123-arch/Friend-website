<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yayyy! 💕</title>

    <!-- Cute Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #ffe0ec,
                #f8dcff,
                #dddfff
            );

            font-family: 'Quicksand', sans-serif;

            overflow: hidden;
        }


        /* MAIN CARD */

        .card {

            width: 500px;
            max-width: 90%;

            padding: 55px 40px;

            background: rgba(255,255,255,0.96);

            border-radius: 32px;

            text-align: center;

            box-shadow:
                0 15px 45px rgba(131,77,142,0.20);

            position: relative;

            z-index: 10;

            animation: cardEntrance 1s ease;
        }


        /* LITTLE TOP ICON */

        .gift {

            font-size: 55px;

            margin-bottom: 10px;

            animation: giftBounce 1.5s infinite;
        }


        /* TITLE */

        h1 {

            font-family: 'Pacifico', cursive;

            font-size: 43px;

            color: #ff4f87;

            margin-bottom: 20px;
        }


        /* MESSAGE */

        .message {

            color: #777;

            font-size: 18px;

            line-height: 1.7;

            margin-bottom: 30px;
        }


        /* QUESTION */

        h2 {

            color: #333;

            font-size: 23px;

            margin-bottom: 25px;
        }


        /* BUTTON AREA */

        .buttons {

            display: flex;

            justify-content: center;

            gap: 15px;

            flex-wrap: wrap;
        }


        button {

            border: none;

            border-radius: 30px;

            padding: 15px 28px;

            min-width: 140px;

            font-family: 'Quicksand', sans-serif;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.3s;
        }


        /* YES */

        #readyBtn {

            background: #ff5a91;

            color: white;

            box-shadow:
                0 6px 18px rgba(255,90,145,0.35);
        }


        #readyBtn:hover {

            background: #ff3477;

            transform: scale(1.1);
        }


        /* NOT YET */

        #waitBtn {

            background: #eeeeee;

            color: #555;
        }


        #waitBtn:hover {

            transform: scale(1.05);
        }


        /* FUNNY MESSAGE */

        #funnyMessage {

            height: 25px;

            margin-top: 20px;

            color: #ff5a91;

            font-size: 15px;

            font-weight: 600;

            opacity: 0;

            transition: 0.4s;
        }


        /* FLOATING ELEMENTS */

        .float {

            position: fixed;

            bottom: -60px;

            font-size: 25px;

            pointer-events: none;

            opacity: 0;

            z-index: 1;

            animation: floatUp 7s linear infinite;
        }


        .f1 {
            left: 8%;
            animation-delay: 0s;
        }

        .f2 {
            left: 23%;
            animation-delay: 3s;
        }

        .f3 {
            left: 48%;
            animation-delay: 1s;
        }

        .f4 {
            left: 70%;
            animation-delay: 4s;
        }

        .f5 {
            left: 90%;
            animation-delay: 2s;
        }


        /* CARD ENTRANCE */

        @keyframes cardEntrance {

            0% {

                opacity: 0;

                transform:
                    scale(0.7)
                    rotate(-3deg);
            }

            70% {

                transform:
                    scale(1.04)
                    rotate(1deg);
            }

            100% {

                opacity: 1;

                transform:
                    scale(1)
                    rotate(0deg);
            }
        }


        /* GIFT BOUNCE */

        @keyframes giftBounce {

            0%,
            100% {

                transform: translateY(0)
                           rotate(-5deg);
            }

            50% {

                transform: translateY(-10px)
                           rotate(5deg);
            }
        }


        /* FLOAT */

        @keyframes floatUp {

            0% {

                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 0;
            }

            15% {
                opacity: 0.7;
            }

            80% {
                opacity: 0.7;
            }

            100% {

                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }


        /* MOBILE */

        @media (max-width: 500px) {

            .card {

                padding: 40px 22px;
            }

            h1 {

                font-size: 35px;
            }

            h2 {

                font-size: 20px;
            }

            .message {

                font-size: 16px;
            }

            .gift {

                font-size: 45px;
            }
        }

    </style>

</head>


<body>


    <!-- Floating decorations -->

    <div class="float f1">💗</div>

    <div class="float f2">✨</div>

    <div class="float f3">♡</div>

    <div class="float f4">🌸</div>

    <div class="float f5">💕</div>



    <!-- MAIN CARD -->

    <div class="card">


        <div class="gift">
            🎁
        </div>


        <h1>
            Yayyy! 💕
        </h1>


        <p class="message">

            I knew you would click YES 😌✨

            <br>

            But waittt...

            <br>

            The surprise isn't that easy re you ready for the next part? 👀
        </h2>


        <div class="buttons">


            <button
                id="readyBtn"
                type="button"
                onclick="nextPage()"
            >

                I'M READY 💖

            </button>


            <button
                id="waitBtn"
                type="button"
                onclick="notReady()"
            >

                NOT YET 🙈

            </button>


        </div>


        <div id="funnyMessage">

            Hehe... take your time 😂💕

        </div>


    </div>



    <script>


        /* GO TO PAGE 3 */

        function nextPage() {

            window.location.href = "memories.html";

        }


        /* NOT READY BUTTON */

        function notReady() {

            const message =
                document.getElementById("funnyMessage");


            message.style.opacity = "1";


            document.getElementById("waitBtn")
                .innerHTML = "OKAY I'M READY 😂";

        }


    </script>


</body>

</html>
